name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build Fabric
        run: .\gradlew.bat build --no-daemon

      - name: Build Forge
        run: .\gradlew.bat -p forge build --no-daemon

      - name: Upload Fabric distributable
        uses: actions/upload-artifact@v4
        with:
          name: digital-storage-cloud-fabric-${{ github.sha }}
          path: |
            build/libs/digital-storage-cloud-fabric-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
            !build/libs/*-dev-shadow.jar
          if-no-files-found: error

      - name: Upload Forge distributable
        uses: actions/upload-artifact@v4
        with:
          name: digital-storage-cloud-forge-${{ github.sha }}
          path: |
            forge/build/libs/digital-storage-cloud-forge-*.jar
            !forge/build/libs/*-sources.jar
            !forge/build/libs/*-dev.jar
            !forge/build/libs/*-dev-shadow.jar
          if-no-files-found: error
