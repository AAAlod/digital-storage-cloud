plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

def product = new Properties()
file('../gradle.properties').withInputStream { product.load(it) }
version = product.mod_version
group = product.maven_group
base { archivesName = 'digital-storage-cloud-forge' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}
minecraft {
    mappings channel: 'official', version: product.minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        server {
            workingDirectory project.hasProperty('dscRunDir') ? file(project.property('dscRunDir')) : file('run')
            args '--nogui'
            if (project.hasProperty('dscIntegration')) {
                property 'digitalstorage.integrationTestRoot', new File(workingDirectory, 'audit-world').absolutePath
            }
            mods { digitalstorage { source sourceSets.main } }
        }
        client {
            workingDirectory file('run')
            mods { digitalstorage { source sourceSets.main } }
        }
    }
}
repositories { mavenCentral(); flatDir { dirs 'libs' } }
configurations { shade; implementation.extendsFrom shade }
dependencies {
    minecraft "net.minecraftforge:forge:${product.minecraft_version}-47.4.10"
    implementation fg.deobf('local.tom:toms_storage:1.20-1.7.1')
    shade "com.electronwill.night-config:core:${product.night_config_version}"
    shade "com.electronwill.night-config:toml:${product.night_config_version}"
    compileOnly 'org.jetbrains:annotations:23.0.0'
}

// Toml 3.9.0 declares Multi-Release but has no META-INF/versions entries.
// Forge's development SecureJar scanner cannot open that empty version tree.
// Repair only the development runtime copy; release shading uses the exact dependency.
def developmentToml = tasks.register('developmentToml', Jar) {
    archiveFileName = "toml-${product.night_config_version}-forge-development.jar"
    destinationDirectory = layout.buildDirectory.dir('development-libs')
    def original = providers.provider {
        configurations.shade.files.find { it.name == "toml-${product.night_config_version}.jar" }
                ?: { throw new GradleException('Toml development dependency missing') }()
    }
    from({ zipTree(original.get()) }) { exclude 'META-INF/MANIFEST.MF' }
    doFirst {
        def archive = new java.util.jar.JarFile(original.get())
        try {
            if (archive.entries().toList().any { it.name.startsWith('META-INF/versions/') }) {
                throw new GradleException('Recheck Toml development repair: versioned entries now exist')
            }
            manifest.attributes(archive.manifest.mainAttributes.collectEntries { key, value ->
                key.toString().equalsIgnoreCase('Multi-Release') ? [:] : [(key.toString()): value.toString()]
            })
        } finally { archive.close() }
    }
}
configurations.runtimeClasspath.exclude group: 'com.electronwill.night-config', module: 'toml'
dependencies { runtimeOnly files(developmentToml) }
apply from: 'development-runtime.gradle'

// Compile the same authoritative shared sources against Forge's patched Minecraft.
// Keep FG and Loom in separate Gradle builds, with no plugin/classloader coupling.
apply from: '../common/source-layout.gradle'
sourceSets.main.java {
    srcDir '../src/main/java'
    exclude dscCommonExcludes
}
sourceSets.main.resources {
    srcDir '../src/main/resources'
    exclude 'fabric.mod.json', 'digitalstorage.mixins.json', '**/*.md'
}
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
tasks.register('verifySharedSources') {
    dependsOn tasks.named('compileJava')
    doLast {
        def shared = fileTree('../src/main/java') { include '**/*.java'; exclude dscCommonExcludes }
        def forbidden = ~/net[.\/]fabricmc|net[.\/]minecraftforge|com[.\/]tom|dev[.\/]kehai[.\/]digitalstorage[.\/](platform|forge)/
        shared.each { source ->
            if (source.getText('UTF-8') =~ forbidden) {
                throw new GradleException("Platform reference in shared source: ${source.name}")
            }
        }
        def classes = sourceSets.main.output.classesDirs.asFileTree.matching {
            include '**/*.class'
            exclude 'dev/kehai/digitalstorage/forge/**'
        }
        classes.each { compiled ->
            if (new String(compiled.bytes, java.nio.charset.StandardCharsets.ISO_8859_1) =~ forbidden) {
                throw new GradleException("Platform reference in Forge-compiled shared bytecode: ${compiled.name}")
            }
        }
        if (classes.isEmpty()) throw new GradleException('No Forge-compiled shared classes inspected')
        logger.lifecycle("Forge shared boundary passed: ${shared.files.size()} authoritative sources, ${classes.files.size()} classes")
    }
}
tasks.named('check') { dependsOn tasks.named('verifySharedSources') }
tasks.named('jar') { archiveClassifier = 'dev' }
tasks.named('jar') { manifest.attributes('MixinConfigs': 'digitalstorage.forge.mixins.json') }
tasks.named('shadowJar') {
    manifest.attributes('MixinConfigs': 'digitalstorage.forge.mixins.json')
    archiveClassifier = ''
    configurations = [project.configurations.shade]
    relocate 'com.electronwill.nightconfig', 'dev.kehai.digitalstorage.internal.nightconfig'
}
reobf { shadowJar {} }

// Explicit audit fixture only; never included in the player binary or sources JAR.
sourceSets {
    restartFixture {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += compileClasspath
    }
}
tasks.register('restartFixtureJar', Jar) {
    from sourceSets.restartFixture.output
    archiveBaseName = 'dsc-restart-fixture'
    archiveVersion = '1'
    manifest.attributes('MixinConfigs': 'dsc.restart.mixins.json')
}
reobf { restartFixtureJar {} }
tasks.named('build') { dependsOn 'reobfShadowJar' }
tasks.register('verifyForgeArtifact') {
    dependsOn 'reobfShadowJar'
    doLast {
        def archive = new java.util.zip.ZipFile(tasks.shadowJar.archiveFile.get().asFile)
        try {
            def entries = archive.entries().toList()
            def forbidden = entries.findAll {
                it.name == 'fabric.mod.json' || it.name == 'dsc.restart.mixins.json' || it.name.endsWith('.md') ||
                        it.name.startsWith('dev/kehai/digitalstorage/audit/') ||
                        it.name.startsWith('com/tom/') || it.name.startsWith('me/shedaniel/') ||
                        it.name.startsWith('net/fabricmc/') || it.name.startsWith('META-INF/jars/') ||
                        it.name.startsWith('dev/kehai/digitalstorage/platform/fabric/')
            }
            if (forbidden) throw new GradleException("Forbidden Forge JAR entries: ${forbidden*.name}")
            if (entries*.name.toSet().size() != entries.size()) throw new GradleException('Duplicate Forge JAR entries')
            def metadata = archive.getEntry('META-INF/mods.toml')
            if (metadata == null || !archive.getInputStream(metadata).getText('UTF-8').contains('version="' + project.version + '"')) {
                throw new GradleException('Forge metadata version mismatch')
            }
            ['pack.mcmeta', 'data/digitalstorage/digital_storage_tiers/default.json',
             'data/digitalstorage/recipes/digital_storage_accessor.json',
             'data/digitalstorage/recipes/advanced_inventory_hopper.json',
             'data/digitalstorage/loot_tables/blocks/advanced_inventory_hopper.json',
             'data/minecraft/tags/blocks/mineable/pickaxe.json',
             'data/minecraft/tags/blocks/needs_iron_tool.json',
             'META-INF/accesstransformer.cfg',
             'digitalstorage.forge.mixins.json',
             'assets/digitalstorage/lang/zh_cn.json'].each { required ->
                if (archive.getEntry(required) == null) throw new GradleException("Missing Forge resource: ${required}")
            }
            def manifest = new java.util.jar.Manifest(archive.getInputStream(archive.getEntry('META-INF/MANIFEST.MF')))
            if (manifest.mainAttributes.getValue('MixinConfigs') != 'digitalstorage.forge.mixins.json') {
                throw new GradleException('Forge Tom Mixin configuration missing from manifest')
            }
            logger.lifecycle("Forge artifact passed: ${entries.size()} entries, no forbidden dependency payload")
        } finally { archive.close() }
    }
}
tasks.named('check') { dependsOn 'verifyForgeArtifact' }
tasks.withType(JavaExec).configureEach {
    if (name == 'runServer') standardInput = System.in
}
