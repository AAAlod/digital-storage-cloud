plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Loom 1.6 can remap Tom's intermediary classes, but rejects the harmless
// Loom 1.8 producer-version marker before doing so. Build a compile-only copy
// with that one development marker removed; the runtime mod jar is untouched.
def tomRuntimeJar = file('libs/toms_storage_fabric-1.20-1.7.1.jar')
def tomCompileJar = file('.gradle/tom-compile/toms_storage_fabric-1.20-1.7.1.jar')
if (!tomCompileJar.isFile() || tomCompileJar.lastModified() < tomRuntimeJar.lastModified()) {
    tomCompileJar.parentFile.mkdirs()
    def sourceJar = new java.util.jar.JarFile(tomRuntimeJar)
    try {
        def manifest = new java.util.jar.Manifest(sourceJar.manifest)
        manifest.mainAttributes.remove(new java.util.jar.Attributes.Name('Fabric-Loom-Version'))
        def outputJar = new java.util.jar.JarOutputStream(new FileOutputStream(tomCompileJar), manifest)
        try {
            sourceJar.entries().each { sourceEntry ->
                if (!sourceEntry.name.equalsIgnoreCase('META-INF/MANIFEST.MF')) {
                    def outputEntry = new java.util.zip.ZipEntry(sourceEntry.name)
                    outputEntry.time = sourceEntry.time
                    outputJar.putNextEntry(outputEntry)
                    if (!sourceEntry.directory) {
                        sourceJar.getInputStream(sourceEntry).withCloseable { input ->
                            input.transferTo(outputJar)
                        }
                    }
                    outputJar.closeEntry()
                }
            }
        } finally {
            outputJar.close()
        }
    } finally {
        sourceJar.close()
    }
}

// Loom does not carry nested jars through a local file dependency remap. Extract
// Tom's bundled runtime libraries so local runs match the published mod jar.
def tomLocalRuntimeDirectory = file('.gradle/tom-runtime')
def clothRuntimeJar = new File(tomLocalRuntimeDirectory, 'cloth-config-fabric-11.1.136.jar')
def basicMathRuntimeJar = new File(tomLocalRuntimeDirectory, 'basic-math-0.6.1.jar')
def extractNestedJar = { File source, String entryName, File target ->
    if (!target.isFile() || target.lastModified() < source.lastModified()) {
        target.parentFile.mkdirs()
        def sourceJar = new java.util.jar.JarFile(source)
        try {
            def nestedEntry = sourceJar.getJarEntry(entryName)
            if (nestedEntry == null) {
                throw new GradleException("Missing nested runtime dependency ${entryName} in ${source}")
            }
            sourceJar.getInputStream(nestedEntry).withCloseable { input ->
                java.nio.file.Files.copy(
                        input,
                        target.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
            }
        } finally {
            sourceJar.close()
        }
    }
}
extractNestedJar(tomRuntimeJar, 'META-INF/jars/cloth-config-fabric-11.1.136.jar', clothRuntimeJar)
extractNestedJar(clothRuntimeJar, 'META-INF/jars/basic-math-0.6.1.jar', basicMathRuntimeJar)

repositories {
    mavenCentral()
}

configurations {
    nightConfig
    implementation.extendsFrom(nightConfig)
}

dependencies {
    implementation project(path: ':common', configuration: 'namedElements')
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    nightConfig "com.electronwill.night-config:core:${project.night_config_version}"
    nightConfig "com.electronwill.night-config:toml:${project.night_config_version}"

    // Compile against the Tom's 1.7.1 compatibility baseline. The jar is not bundled.
    modCompileOnly files(tomCompileJar)
    // Use the marker-compatible copy for Loom's local server/client runs too.
    modLocalRuntime files(tomCompileJar, clothRuntimeJar, basicMathRuntimeJar)
}

loom {
    mixin {
        defaultRefmapName = 'digitalstorage.refmap.json'
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// The root project is the Fabric distribution; shared code is compiled by common.
sourceSets.main.java {
    include 'dev/kehai/digitalstorage/platform/fabric/**/*.java'
    include 'dev/kehai/digitalstorage/DigitalStorageMod.java'
    include 'dev/kehai/digitalstorage/DigitalStorageClient.java'
    include 'dev/kehai/digitalstorage/command/**/*.java'
    include 'dev/kehai/digitalstorage/block/AdvancedInventoryHopperBlock.java'
    include 'dev/kehai/digitalstorage/integration/TomIntegrationStatus.java'
    include 'dev/kehai/digitalstorage/storage/DigitalItemStorageSelfTest.java'
}
evaluationDependsOn(':common')
def commonOutput = project(':common').sourceSets.main.output

tasks.named('check') { dependsOn ':common:check' }
tasks.named('sourcesJar') { from project(':common').sourceSets.main.allSource }

tasks.register('verifySourcePartition') {
    inputs.files(sourceSets.main.java, project(':common').sourceSets.main.java)
    doLast {
        def all = fileTree('src/main/java') { include '**/*.java' }.files
        def fabric = sourceSets.main.java.files
        def shared = project(':common').sourceSets.main.java.files
        if (!(fabric.intersect(shared)).isEmpty() || fabric + shared != all) {
            throw new GradleException('Every Java source must belong to exactly one of common and Fabric')
        }
        logger.lifecycle("Source partition passed: ${shared.size()} common, ${fabric.size()} Fabric")
    }
}
tasks.named('check') { dependsOn tasks.named('verifySourcePartition') }

jar {
    from commonOutput
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

shadowJar {
    from commonOutput
    configurations = [project.configurations.nightConfig]
    archiveClassifier = 'dev-shadow'
    relocate 'com.electronwill.nightconfig', 'dev.kehai.digitalstorage.internal.nightconfig'
    exclude 'module-info.class'
    exclude 'META-INF/versions/**/module-info.class'
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

remapJar {
    dependsOn shadowJar
    inputFile = shadowJar.archiveFile
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
